{% extends 'analysis/base.html' %}

{% block title %}Удалить участок — Анализ техники{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle display-4 text-danger d-block mb-3"></i>
                <h5>Удалить участок «{{ section.name }}»?</h5>
                <p class="text-muted">Отчёты, привязанные к этому участку, останутся — связь будет удалена.</p>
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4">Удалить</button>
                    </form>
                    <a href="{% url 'sections' %}" class="btn btn-outline-secondary px-4">Отмена</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
