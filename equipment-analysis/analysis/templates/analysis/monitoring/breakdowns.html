{% extends 'analysis/base.html' %}
{% block title %}Виды поломок — Мониторинг{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <a href="{% url 'monitoring_index' %}" class="text-muted text-decoration-none small">
            <i class="bi bi-chevron-left"></i> Мониторинг
        </a>
        <h4 class="mb-0 fw-bold mt-1"><i class="bi bi-exclamation-triangle me-2"></i>Виды поломок</h4>
    </div>
    <a href="{% url 'monitoring_breakdown_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Добавить
    </a>
</div>
{% if items %}
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead><tr><th class="ps-4">Вид поломки</th><th></th></tr></thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td class="ps-4 fw-semibold">{{ item.name }}</td>
                    <td class="text-end pe-3">
                        <a href="{% url 'monitoring_breakdown_edit' item.pk %}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></a>
                        <a href="{% url 'monitoring_breakdown_delete' item.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% else %}
<div class="card"><div class="card-body text-center py-5">
    <i class="bi bi-exclamation-triangle display-4 text-muted d-block mb-3"></i>
    <h5 class="text-muted">Виды поломок не добавлены</h5>
    <a href="{% url 'monitoring_breakdown_create' %}" class="btn btn-primary mt-3"><i class="bi bi-plus-lg me-1"></i>Добавить</a>
</div></div>
{% endif %}
{% endblock %}
